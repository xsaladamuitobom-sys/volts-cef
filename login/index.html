<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTS RP — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <!-- FUNDO PANORÂMICO -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-photo"></div>
        <div class="bg-vignette"></div>
    </div>

    <!-- TOPO: RELÓGIO NA ESQUERDA + DISCORD NA DIREITA -->
    <header class="top-bar">
        <div class="clock-pill" title="Horário atual">
            <span class="clock-dot"></span>
            <span id="liveClock" class="clock-time">--:--:--</span>
        </div>

        <button id="discordLink" type="button" class="discord-btn" title="Copiar Discord VOLTS RP" aria-label="Copiar Discord VOLTS RP">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
                <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
            </svg>
        </button>
    </header>

    <!-- CENTRO: LOGO CENTRALIZADA + CAIXA ROXA -->
    <main class="center-stage">
        <div class="auth-stack">
            <img src="./logo.png?v=3" alt="VOLTS RP" class="login-logo">

            <section class="purple-card" aria-label="Autenticação VOLTS RP">
                <div class="card-top">
                    <span class="server-tag">VOLTS RP</span>
                    <span id="accountBadge" class="account-pill">Verificando...</span>
                </div>

                <div class="card-heading">
                    <h1 id="cardTitle">Acessar Conta</h1>
                    <p id="cardSubtitle">Aguardando sincronização com o servidor.</p>
                </div>

                <div class="tabs-bar" role="tablist">
                    <button id="tabLogin" type="button" class="tab-btn active" role="tab" aria-selected="true">Entrar</button>
                    <button id="tabRegister" type="button" class="tab-btn" role="tab" aria-selected="false">Criar Conta</button>
                </div>

                <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

                <!-- FORMULÁRIO DE LOGIN -->
                <form id="formLogin" class="auth-form" autocomplete="off">
                    <div class="input-block">
                        <label for="loginUsername">Usuário</label>
                        <div class="input-shell readonly">
                            <input id="loginUsername" type="text" readonly>
                        </div>
                    </div>

                    <div class="input-block">
                        <label for="loginPassword">Senha</label>
                        <div class="input-shell">
                            <input id="loginPassword" type="password" placeholder="Digite sua senha" maxlength="64" required>
                            <button type="button" class="eye-btn" data-target="loginPassword" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button id="btnSubmitLogin" type="submit" class="submit-btn">
                        <span>Entrar</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>

                <!-- FORMULÁRIO DE CRIAR CONTA -->
                <form id="formRegister" class="auth-form hidden" autocomplete="off">
                    <div class="input-block">
                        <label for="regUsername">Usuário</label>
                        <div class="input-shell readonly">
                            <input id="regUsername" type="text" readonly>
                        </div>
                    </div>

                    <div class="input-block">
                        <label for="regPassword">Senha (mín. 6 caracteres)</label>
                        <div class="input-shell">
                            <input id="regPassword" type="password" placeholder="Crie uma senha" maxlength="64" required>
                            <button type="button" class="eye-btn" data-target="regPassword" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="input-block">
                        <label for="regPasswordConfirm">Confirmar Senha</label>
                        <div class="input-shell">
                            <input id="regPasswordConfirm" type="password" placeholder="Repita a senha" maxlength="64" required>
                            <button type="button" class="eye-btn" data-target="regPasswordConfirm" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button id="btnSubmitRegister" type="submit" class="submit-btn">
                        <span>Criar Conta</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>
            </section>
        </div>
    </main>

    <!-- CANTO INFERIOR ESQUERDO: TEXTO LIMPO SEM CAIXA (ATUALIZAÇÕES) -->
    <aside class="updates-clean" aria-label="Atualizações do servidor">
        <span class="updates-heading">ATUALIZAÇÕES</span>
        <ul class="updates-items">
            <li><span class="dot-opt"></span> Otimização geral da interface</li>
            <li><span class="dot-fix"></span> Correção de estabilidade ao sair</li>
            <li><span class="dot-new"></span> Novo visual de autenticação</li>
        </ul>
    </aside>

    <!-- CANTO INFERIOR DIREITO: MUSIC PLAYER -->
    <div class="player-box" aria-label="Player de música">
        <button id="btnPrevTrack" type="button" class="ctrl-btn" title="Música anterior" aria-label="Música anterior">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
            </svg>
        </button>

        <button id="btnPlayPause" type="button" class="ctrl-btn play-btn" title="Tocar ou pausar" aria-label="Tocar ou pausar">
            <svg id="iconPlay" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg id="iconPause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
        </button>

        <button id="btnNextTrack" type="button" class="ctrl-btn" title="Próxima música" aria-label="Próxima música">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
        </button>

        <div class="track-meta">
            <span id="musicTrackTitle" class="track-title">Carregando faixa...</span>
            <span id="musicTrackArtist" class="track-artist">VOLTS RP</span>
        </div>
    </div>

    <audio id="bgMusic" preload="auto"></audio>
    <script src="app.js?v=3"></script>
</body>
</html>
