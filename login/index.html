<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTS RP — Portal de Autenticação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-photo"></div>
        <div class="bg-vignette"></div>
        <div class="bg-grain"></div>
    </div>

    <div class="cinematic-frame">
        <header class="top-bar">
            <div class="brand">
                <div class="brand-badge">VRP</div>
                <div class="brand-text">
                    <h1>VOLTS <span>ROLEPLAY</span></h1>
                    <p>PORTAL DE AUTENTICAÇÃO • LOS SANTOS</p>
                </div>
            </div>

            <div class="top-actions">
                <div class="music-widget" title="Player de música da tela inicial">
                    <div class="music-meta">
                        <span id="musicTrackTitle" class="music-track">Carregando faixa...</span>
                        <span id="musicTrackArtist" class="music-artist">Artista desconhecido</span>
                    </div>

                    <div id="musicEq" class="eq-bars" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <button id="btnNextTrack" type="button" class="btn-icon" title="Próxima música" aria-label="Próxima música">⏭</button>
                    <button id="btnAudio" type="button" class="btn-ghost">Música: ON</button>
                </div>

                <button id="btnFallback" type="button" class="btn-ghost" title="Modo clássico">Modo Clássico</button>
                <button id="btnQuit" type="button" class="btn-quit">Sair</button>
            </div>
        </header>

        <main class="portal-container">
            <section class="auth-card" aria-label="Autenticação de jogador">
                <div class="sync-strip">
                    <div class="sync-left">
                        <span id="syncDot" class="sync-dot"></span>
                        <span id="syncStatusText">Sincronizando com o servidor...</span>
                    </div>
                    <span id="syncTimer">00s</span>
                </div>

                <div class="card-header">
                    <div id="accountStatusBadge" class="account-pill unregistered">
                        <span class="status-dot"></span>
                        <span id="accountStatusText">Verificando conta...</span>
                    </div>
                    <h2 id="cardTitle">Acessar Conta</h2>
                    <p id="cardSubtitle">Aguardando dados do seu personagem.</p>
                </div>

                <div class="auth-tabs" role="tablist">
                    <button id="tabLogin" type="button" class="tab-btn active" data-tab="login" role="tab" aria-selected="true">Acessar Conta</button>
                    <button id="tabRegister" type="button" class="tab-btn" data-tab="register" role="tab" aria-selected="false">Criar Conta</button>
                </div>

                <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

                <form id="formLogin" class="auth-form" autocomplete="off">
                    <div class="input-group">
                        <label for="loginUsername">Personagem / Usuário</label>
                        <div class="input-wrapper readonly">
                            <input id="loginUsername" type="text" readonly>
                            <span class="input-tag">SA-MP</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Senha</label>
                        <div class="input-wrapper">
                            <input id="loginPassword" type="password" placeholder="Digite sua senha" maxlength="64" required>
                            <button type="button" class="toggle-pass" data-target="loginPassword">Ver</button>
                        </div>
                    </div>

                    <button id="btnSubmitLogin" type="submit" class="btn-primary">
                        <span>Entrar no Jogo</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>

                <form id="formRegister" class="auth-form hidden" autocomplete="off">
                    <div class="input-group">
                        <label for="regUsername">Personagem / Usuário</label>
                        <div class="input-wrapper readonly">
                            <input id="regUsername" type="text" readonly>
                            <span class="input-tag">NOVO</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">Nova Senha (mín. 6 caracteres)</label>
                        <div class="input-wrapper">
                            <input id="regPassword" type="password" placeholder="Crie uma senha forte" maxlength="64" required>
                            <button type="button" class="toggle-pass" data-target="regPassword">Ver</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPasswordConfirm">Confirmar Senha</label>
                        <div class="input-wrapper">
                            <input id="regPasswordConfirm" type="password" placeholder="Repita a mesma senha" maxlength="64" required>
                            <button type="button" class="toggle-pass" data-target="regPasswordConfirm">Ver</button>
                        </div>
                    </div>

                    <button id="btnSubmitRegister" type="submit" class="btn-primary accent-amber">
                        <span>Criar Conta e Entrar</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>
            </section>
        </main>

        <footer class="bottom-bar">
            <div class="footer-left">
                <span>VOLTS RP • Conexão Segura</span>
                <span>•</span>
                <span id="liveClock">--:--:--</span>
            </div>
            <span>CEF Portal Ready</span>
        </footer>
    </div>

    <audio id="bgMusic" preload="auto"></audio>

    <script src="app.js"></script>
</body>
</html>
