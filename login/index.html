<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050609">
    <title>VOLTS RP — Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=33">
</head>
<body>
    <!-- CAMADA DE FUNDO: VÍDEO 100% OPACIDADE COM ESCURECIMENTO SUAVE -->
    <div class="bg-layer" aria-hidden="true">
        <video
            id="bgVideo"
            class="bg-video"
            autoplay
            muted
            loop
            playsinline
            preload="auto"
        >
            <source src="./fundo.webm?v=33" type="video/webm">
        </video>
        <div class="bg-dim"></div>
    </div>

    <!-- TOPO ESQUERDO: RELÓGIO E DATA -->
    <header class="hud-top-left" aria-label="Horário e data">
        <span class="accent-bar-gold" aria-hidden="true"></span>
        <div class="clock-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"/>
                <polyline points="12 7 12 12 15 14"/>
            </svg>
        </div>
        <div class="clock-texts">
            <span id="liveClock" class="clock-time">00:00:00</span>
            <span id="liveDate" class="clock-date">CARREGANDO DATA...</span>
        </div>
    </header>

    <!-- TOPO DIREITO: STATUS DO SERVIDOR E JOGADORES -->
    <aside id="serverStatusBox" class="hud-top-right is-online" aria-label="Status do servidor">
        <span id="serverStatusDot" class="status-dot" aria-hidden="true"></span>
        <div class="status-info">
            <span id="serverStatusText" class="status-title">SERVIDOR ONLINE</span>
            <span id="playerCountText" class="status-players">JOGADORES: 0/50</span>
        </div>
        <span class="accent-bar-muted" aria-hidden="true"></span>
    </aside>

    <!-- CENTRO ESQUERDO: DICAS DA CIDADE -->
    <section class="city-tips-card" aria-label="Dicas da cidade">
        <div class="tips-corner-glow" aria-hidden="true"></div>

        <div class="tips-header">
            <span class="tips-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18h6"/>
                    <path d="M10 22h4"/>
                    <path d="M12 2a7 7 0 0 0-4 12.75c.65.45 1 1.15 1 1.95V17h6v-.3c0-.8.35-1.5 1-1.95A7 7 0 0 0 12 2z"/>
                </svg>
            </span>
            <h2 class="tips-title">DICAS DA CIDADE</h2>
        </div>

        <p id="cityTipText" class="tips-body">
            Respeite as regras do servidor e ajude a manter a experiência de todos.
        </p>

        <div class="tips-footer">
            <span id="cityTipCounter" class="tips-counter">01 / 16</span>

            <div id="cityTipSegments" class="tips-segments" role="tablist" aria-label="Selecionar dica">
                <button type="button" class="tip-seg active" data-index="0" aria-label="Dica 1"></button>
                <button type="button" class="tip-seg" data-index="1" aria-label="Dica 2"></button>
                <button type="button" class="tip-seg" data-index="2" aria-label="Dica 3"></button>
                <button type="button" class="tip-seg" data-index="3" aria-label="Dica 4"></button>
                <button type="button" class="tip-seg" data-index="4" aria-label="Dica 5"></button>
                <button type="button" class="tip-seg" data-index="5" aria-label="Dica 6"></button>
                <button type="button" class="tip-seg" data-index="6" aria-label="Dica 7"></button>
                <button type="button" class="tip-seg" data-index="7" aria-label="Dica 8"></button>
                <button type="button" class="tip-seg" data-index="8" aria-label="Dica 9"></button>
                <button type="button" class="tip-seg" data-index="9" aria-label="Dica 10"></button>
                <button type="button" class="tip-seg" data-index="10" aria-label="Dica 11"></button>
                <button type="button" class="tip-seg" data-index="11" aria-label="Dica 12"></button>
                <button type="button" class="tip-seg" data-index="12" aria-label="Dica 13"></button>
                <button type="button" class="tip-seg" data-index="13" aria-label="Dica 14"></button>
                <button type="button" class="tip-seg" data-index="14" aria-label="Dica 15"></button>
                <button type="button" class="tip-seg" data-index="15" aria-label="Dica 16"></button>
            </div>

            <div class="tips-arrows">
                <button id="btnPrevTip" type="button" class="tip-arrow-btn" title="Dica anterior" aria-label="Dica anterior">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="15 18 9 12 15 6"/>
                    </svg>
                </button>
                <button id="btnNextTip" type="button" class="tip-arrow-btn" title="Próxima dica" aria-label="Próxima dica">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>
        </div>
    </section>

    <!-- CENTRO DIREITO: CARD DE AUTENTICAÇÃO -->
    <main class="auth-card" aria-label="Autenticação VOLTS RP">
        <div class="auth-corner-glow" aria-hidden="true"></div>
        <div class="auth-bottom-notch" aria-hidden="true"></div>

        <!-- ABAS -->
        <div class="tabs-bar" role="tablist">
            <button id="tabLogin" type="button" class="tab-btn active" role="tab" aria-selected="true">
                <svg class="tab-icon" viewBox="0 0 24 24" width="17" height="17" fill="currentColor">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
                <span>Entrar</span>
            </button>

            <button id="tabRegister" type="button" class="tab-btn" role="tab" aria-selected="false">
                <svg class="tab-icon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="9"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                <span>Criar Conta</span>
            </button>
        </div>

        <!-- CORPO DO FORMULÁRIO -->
        <div class="auth-body">
            <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

            <!-- FORMULÁRIO ENTRAR -->
            <form id="formLogin" class="auth-form" autocomplete="off">
                <div class="field-row">
                    <span class="field-side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <div class="field-main">
                        <label for="loginUsername" class="field-label">Usuário</label>
                        <div class="input-box is-readonly">
                            <input id="loginUsername" type="text" placeholder="Digite seu usuário..." readonly>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <span class="field-side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="11" width="16" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            <circle cx="12" cy="16" r="1"/>
                        </svg>
                    </span>
                    <div class="field-main">
                        <label for="loginPassword" class="field-label">Senha</label>
                        <div class="input-box">
                            <input id="loginPassword" type="password" placeholder="Digite sua senha..." maxlength="32" required>
                            <button type="button" class="eye-btn" data-target="loginPassword" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-label">
                        <input id="rememberMe" type="checkbox" class="remember-checkbox">
                        <span class="remember-box" aria-hidden="true"></span>
                        <span>Lembrar-me</span>
                    </label>

                    <button id="btnForgotPass" type="button" class="forgot-link">
                        Esqueceu sua senha?
                    </button>
                </div>

                <button id="btnSubmitLogin" type="submit" class="submit-btn">
                    <svg class="submit-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>Entrar na Cidade</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <!-- FORMULÁRIO CRIAR CONTA -->
            <form id="formRegister" class="auth-form hidden" autocomplete="off">
                <div class="field-row">
                    <span class="field-side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <div class="field-main">
                        <label for="regUsername" class="field-label">Usuário</label>
                        <div class="input-box is-readonly">
                            <input id="regUsername" type="text" placeholder="Digite seu usuário..." readonly>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <span class="field-side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="11" width="16" height="10" rx="2"/>
                            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                            <circle cx="12" cy="16" r="1"/>
                        </svg>
                    </span>
                    <div class="field-main">
                        <label for="regPassword" class="field-label">Senha (6 a 32 caracteres)</label>
                        <div class="input-box">
                            <input id="regPassword" type="password" placeholder="Crie sua senha..." maxlength="32" required>
                            <button type="button" class="eye-btn" data-target="regPassword" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="field-row">
                    <span class="field-side-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                            <polyline points="9 12 11 14 15 10"/>
                        </svg>
                    </span>
                    <div class="field-main">
                        <label for="regPasswordConfirm" class="field-label">Confirmar Senha</label>
                        <div class="input-box">
                            <input id="regPasswordConfirm" type="password" placeholder="Repita sua senha..." maxlength="32" required>
                            <button type="button" class="eye-btn" data-target="regPasswordConfirm" aria-pressed="false" title="Mostrar ou ocultar senha" aria-label="Mostrar ou ocultar senha">
                                <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon-eye-closed" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button id="btnSubmitRegister" type="submit" class="submit-btn">
                    <svg class="submit-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    <span>Criar Conta na Cidade</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>
        </div>
    </main>

    <!-- RODAPÉ ESQUERDO: PLAYER VOLTS RADIO -->
    <section id="playerBox" class="radio-player" aria-label="Volts Radio">
        <div class="radio-cover-wrap">
            <img id="musicCoverImg" src="./capa.png?v=33" alt="Capa Volts Radio" class="radio-cover-img">
        </div>

        <div class="radio-meta">
            <span id="musicTrackTitle" class="radio-title">Volts Radio</span>
            <span id="musicTrackArtist" class="radio-subtitle">A cidade nunca para</span>
        </div>

        <div class="radio-controls">
            <button id="btnPrevTrack" type="button" class="radio-btn" title="Faixa anterior" aria-label="Faixa anterior">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
                </svg>
            </button>

            <button id="btnPlayPause" type="button" class="radio-btn radio-play-btn" title="Tocar ou pausar" aria-label="Tocar ou pausar">
                <svg id="iconPlay" class="hidden" viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="iconPause" viewBox="0 0 24 24" width="19" height="19" fill="currentColor">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <button id="btnNextTrack" type="button" class="radio-btn" title="Próxima faixa" aria-label="Próxima faixa">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>
        </div>

        <div class="radio-volume">
            <button id="btnMuteToggle" type="button" class="radio-btn volume-icon-btn" title="Silenciar ou ativar som" aria-label="Silenciar ou ativar som">
                <svg id="iconVolOn" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
                <svg id="iconVolOff" class="hidden" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>

            <input id="volumeSlider" type="range" class="volume-slider" min="0" max="100" value="22" aria-label="Controle de volume">
        </div>
    </section>

    <!-- RODAPÉ DIREITO: ASSINATURA -->
    <footer class="hud-bottom-right" aria-label="VOLTS RP">
        <p class="footer-tagline">
            <span class="brand-accent">VOLTS RP</span>
            <span class="brand-sep">•</span>
            <span class="brand-sub">SUA HISTÓRIA COMEÇA AQUI</span>
        </p>
        <span class="accent-bar-gold" aria-hidden="true"></span>
    </footer>

    <audio id="bgMusic" preload="auto"></audio>

    <script src="app.js?v=33"></script>
</body>
</html>
