<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTS RP — Portal de Autenticação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-scene" aria-hidden="true">
        <div class="bg-photo"></div>
        <div class="bg-overlay"></div>
        <div class="bg-accent-glow"></div>
    </div>

    <div class="portal-shell">
        <header class="top-strip">
            <div class="top-brand">
                <span class="top-mark">VRP</span>
                <span class="top-title">VOLTS <strong>ROLEPLAY</strong></span>
            </div>

            <div class="music-pill" title="Trilha sonora da autenticação">
                <div class="music-text">
                    <span id="musicTrackTitle" class="music-name">Carregando faixa...</span>
                    <span id="musicTrackArtist" class="music-artist">Artista</span>
                </div>
                <div id="musicEq" class="eq-bars" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <button id="btnNextTrack" type="button" class="music-btn" title="Próxima música" aria-label="Próxima música">⏭</button>
                <button id="btnAudio" type="button" class="music-btn music-toggle">Música: ON</button>
            </div>
        </header>

        <main class="portal-main">
            <section class="split-portal" aria-label="Portal de acesso VOLTS RP">
                <!-- PAINEL ESQUERDO -->
                <aside class="panel-left">
                    <div class="panel-left-top">
                        <div class="brand-hero">
                            <div class="brand-emblem" aria-hidden="true">V</div>
                            <div>
                                <p class="brand-kicker">LOS SANTOS • ROLEPLAY</p>
                                <h1 class="brand-heading">VOLTS <span>RP</span></h1>
                            </div>
                        </div>

                        <div class="time-card" aria-label="Horário atual">
                            <span class="time-label">HORÁRIO ATUAL</span>
                            <strong id="liveClock" class="time-value">--:--:--</strong>
                        </div>
                    </div>

                    <div class="panel-left-bottom">
                        <div class="status-row">
                            <span id="syncDot" class="status-led"></span>
                            <span id="syncStatusText">Sincronizando autenticação...</span>
                            <span id="syncTimer" class="sync-elapsed">00s</span>
                        </div>
                        <div class="subtle-divider"></div>
                        <p class="panel-note">Autenticação protegida do seu personagem no servidor.</p>
                    </div>
                </aside>

                <!-- PAINEL DIREITO -->
                <div class="panel-right">
                    <div class="auth-header">
                        <div class="auth-brand-top">
                            <span class="auth-mini-logo">VOLTS RP</span>
                            <div id="accountStatusBadge" class="account-badge unregistered">
                                <span class="badge-dot"></span>
                                <span id="accountStatusText">Verificando conta...</span>
                            </div>
                        </div>
                        <h2 id="cardTitle">Acessar Conta</h2>
                        <p id="cardSubtitle">Aguardando verificação do personagem.</p>
                    </div>

                    <div class="mode-switch" role="tablist">
                        <button id="tabLogin" type="button" class="mode-btn active" data-tab="login" role="tab" aria-selected="true">Entrar</button>
                        <button id="tabRegister" type="button" class="mode-btn" data-tab="register" role="tab" aria-selected="false">Criar Conta</button>
                    </div>

                    <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

                    <form id="formLogin" class="auth-form" autocomplete="off">
                        <div class="field-group">
                            <label for="loginUsername">Usuário / Personagem</label>
                            <div class="field-box readonly">
                                <input id="loginUsername" type="text" readonly>
                                <span class="field-tag">CONTA</span>
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="loginPassword">Senha</label>
                            <div class="field-box">
                                <input id="loginPassword" type="password" placeholder="Digite sua senha" maxlength="64" required>
                                <button type="button" class="pass-eye" data-target="loginPassword">Ver</button>
                            </div>
                        </div>

                        <button id="btnSubmitLogin" type="submit" class="btn-main">
                            <span>Entrar</span>
                            <span class="spinner hidden"></span>
                        </button>
                    </form>

                    <form id="formRegister" class="auth-form hidden" autocomplete="off">
                        <div class="field-group">
                            <label for="regUsername">Usuário / Personagem</label>
                            <div class="field-box readonly">
                                <input id="regUsername" type="text" readonly>
                                <span class="field-tag">NOVO</span>
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="regPassword">Senha (mín. 6 caracteres)</label>
                            <div class="field-box">
                                <input id="regPassword" type="password" placeholder="Crie uma senha" maxlength="64" required>
                                <button type="button" class="pass-eye" data-target="regPassword">Ver</button>
                            </div>
                        </div>

                        <div class="field-group">
                            <label for="regPasswordConfirm">Confirmar Senha</label>
                            <div class="field-box">
                                <input id="regPasswordConfirm" type="password" placeholder="Repita a senha" maxlength="64" required>
                                <button type="button" class="pass-eye" data-target="regPasswordConfirm">Ver</button>
                            </div>
                        </div>

                        <button id="btnSubmitRegister" type="submit" class="btn-main btn-create">
                            <span>Criar Conta</span>
                            <span class="spinner hidden"></span>
                        </button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <audio id="bgMusic" preload="auto"></audio>
    <script src="app.js"></script>
</body>
</html>
