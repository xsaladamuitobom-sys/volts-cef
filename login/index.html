<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTS RP - Portal de Autenticação</title>
    <!-- Google Fonts & FontAwesome para Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            font-family: 'Montserrat', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050a;
            color: #fff;
        }

        /* --- BACKGROUND ANIMADO --- */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .bg-image {
            width: 100%;
            height: 100%;
            background-image: url('image_4.png'); /* Usa a sua imagem limpa gerada */
            background-size: cover;
            background-position: center;
            transform: scale(1.05);
            animation: zoomLento 30s ease-in-out infinite alternate;
            filter: brightness(0.6) contrast(1.1);
        }

        @keyframes zoomLento {
            0% { transform: scale(1.03) translate(0px, 0px); }
            100% { transform: scale(1.1) translate(-10px, -5px); }
        }

        /* Vinheta de escuridão e partículas */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(5,5,15,0.2) 20%, rgba(3,3,10,0.85) 90%);
            z-index: 2;
        }

        /* Partículas flutuantes em CSS */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            background-image: 
                radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px),
                radial-gradient(circle, rgba(30,144,255,0.15) 1.5px, transparent 1.5px);
            background-size: 50px 50px, 120px 120px;
            animation: subirParticulas 20s linear infinite;
            opacity: 0.8;
        }

        @keyframes subirParticulas {
            0% { background-position: 0px 0px, 0px 0px; }
            100% { background-position: 50px -500px, 100px -600px; }
        }

        /* --- INTERFACE PRINCIPAL --- */
        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- HEADER & BRANDING --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-area img {
            height: 45px;
            filter: drop-shadow(0 0 8px rgba(0, 140, 255, 0.6));
        }

        .brand-text h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #00d2ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 102, 255, 0.3);
        }

        .brand-text p {
            font-size: 10px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 4px;
        }

        /* --- MUSIC PLAYER --- */
        .music-player {
            display: flex;
            align-items: center;
            background: rgba(10, 10, 25, 0.5);
            border: 1px solid rgba(0, 132, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            backdrop-filter: blur(8px);
            gap: 15px;
            transition: all 0.3s ease;
        }

        .music-player:hover {
            border-color: rgba(0, 132, 255, 0.5);
            box-shadow: 0 0 15px rgba(0, 132, 255, 0.15);
        }

        .music-info {
            display: flex;
            flex-direction: column;
            text-align: right;
        }

        .song-title {
            font-size: 11px;
            font-weight: 800;
            color: #00d2ff;
            letter-spacing: 0.5px;
        }

        .song-artist {
            font-size: 9px;
            color: rgba(255, 255, 255, 0.6);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-player {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .btn-player:hover {
            background: rgba(0, 132, 255, 0.2);
            color: #00d2ff;
            transform: scale(1.05);
        }

        /* Equalizador gráfico animado */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 14px;
            width: 18px;
        }

        .eq-bar {
            width: 2px;
            height: 15%;
            background: #00d2ff;
            border-radius: 1px;
            transition: height 0.15s ease;
        }

        .equalizer.active .eq-bar {
            animation: bounceEQ 1.2s ease-in-out infinite alternate;
        }

        .equalizer.active .eq-bar:nth-child(1) { animation-delay: 0.1s; }
        .equalizer.active .eq-bar:nth-child(2) { animation-delay: 0.4s; }
        .equalizer.active .eq-bar:nth-child(3) { animation-delay: 0.25s; }
        .equalizer.active .eq-bar:nth-child(4) { animation-delay: 0.55s; }

        @keyframes bounceEQ {
            0% { height: 15%; }
            100% { height: 100%; }
        }

        /* --- CARD DE LOGIN --- */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
        }

        .login-card {
            background: rgba(8, 8, 20, 0.45);
            border: 1px solid rgba(0, 140, 255, 0.15);
            width: 380px;
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(255,255,255,0.02);
            transform: translateY(30px);
            opacity: 0;
            animation: showCard 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* Linha brilhante no topo do card */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #0088ff, #00d2ff, transparent);
        }

        @keyframes showCard {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .player-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.08);
            border: 1px solid rgba(0, 210, 255, 0.15);
            padding: 5px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            color: #00d2ff;
            margin-bottom: 20px;
        }

        .player-status-dot {
            width: 6px;
            height: 6px;
            background: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d2ff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .card-header h2 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-header p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        /* --- ABAS DE LOGIN / REGISTRO --- */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.25);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            padding: 10px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: rgba(0, 102, 255, 0.2);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 102, 255, 0.3);
        }

        /* --- CAMPOS DE ENTRADA --- */
        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.45);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .input-wrapper input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 13px 15px 13px 45px;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-wrapper input:focus {
            border-color: #0066ff;
            background: rgba(0, 102, 255, 0.05);
            box-shadow: 0 0 10px rgba(0, 102, 255, 0.1);
        }

        .input-wrapper input:focus + i {
            color: #00d2ff;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.2s ease;
            left: auto !important; /* Desfaz o left absoluto global */
        }

        .toggle-password:hover {
            color: #fff;
        }

        /* --- FEEDBACK / ERROS --- */
        .feedback-message {
            display: none;
            font-size: 11px;
            font-weight: 600;
            color: #ff3b30;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* --- BOTÕES --- */
        .btn-submit {
            width: 100%;
            background: linear-gradient(90deg, #0052d4, #4364f7, #6fb1fc);
            background-size: 200% auto;
            border: none;
            padding: 15px;
            border-radius: 10px;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(67, 100, 247, 0.4);
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            background-position: right center;
            box-shadow: 0 6px 20px rgba(67, 100, 247, 0.6);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* --- FOOTER & METADADOS --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .indicator::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #34c759;
            border-radius: 50%;
            box-shadow: 0 0 6px #34c759;
        }

        .btn-exit {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-exit:hover {
            background: rgba(255, 59, 48, 0.2);
            border-color: rgba(255, 59, 48, 0.4);
            box-shadow: 0 0 10px rgba(255, 59, 48, 0.15);
        }
    </style>
</head>
<body>

    <!-- BACKGROUND ANIMADO -->
    <div class="bg-container">
        <div class="bg-image"></div>
        <div class="overlay"></div>
        <div class="particles"></div>
    </div>

    <!-- ELEMENTOS DA TELA -->
    <div class="screen">
        
        <!-- HEADER -->
        <header>
            <div class="logo-area">
                <div class="brand-text">
                    <h1>Volts RP</h1>
                    <p>Sua história, nossa cidade</p>
                </div>
            </div>

            <!-- MUSIC PLAYER -->
            <div class="music-player">
                <div class="music-info">
                    <span class="song-title">CADASTRANDO NOVO JOGO</span>
                    <span id="song-name" class="song-artist">TRILHA NOTURNA</span>
                </div>
                <!-- Equalizador Gráfico -->
                <div id="eq" class="equalizer active">
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                    <div class="eq-bar"></div>
                </div>
                <div class="player-controls">
                    <button id="btn-audio" class="btn-player" title="Mutar/Desmutar">
                        <i id="audio-icon" class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- CARD DE AUTENTICAÇÃO -->
        <div class="container">
            <div class="login-card">
                
                <div class="player-tag">
                    <span class="player-status-dot"></span>
                    <span id="player-label">Azrael • Sem Cadastro</span>
                </div>

                <div class="card-header">
                    <h2 id="card-title">Criar Conta</h2>
                    <p id="card-desc">Defina uma senha forte para iniciar sua jornada.</p>
                </div>

                <!-- ABAS (SÓ PARA VISUALIZAÇÃO/FEEDBACK, O SERVIDOR JÁ DIZ SE É LOGIN OU REGISTRO) -->
                <div class="tabs">
                    <button id="tab-entrar" class="tab-btn" onclick="switchMode('entrar')">Acessar Conta</button>
                    <button id="tab-criar" class="tab-btn active" onclick="switchMode('criar')">Criar Conta</button>
                </div>

                <!-- FEEDBACK DE ERRO -->
                <div id="feedback" class="feedback-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="feedback-text">Erro ao tentar autenticar.</span>
                </div>

                <!-- FORMULÁRIO -->
                <form id="auth-form" onsubmit="enviarFormulario(event)">
                    <div class="input-group">
                        <label>Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input id="input-senha" type="password" placeholder="Crie uma senha forte (mín. 6 caracteres)" required>
                            <i id="eye-icon" class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                        </div>
                    </div>

                    <div id="confirm-pass-group" class="input-group">
                        <label>Confirmar Senha</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-shield"></i>
                            <input id="input-confirmar" type="password" placeholder="Repita a mesma senha">
                        </div>
                    </div>

                    <button id="btn-action" class="btn-submit" type="submit">Criar Conta e Entrar</button>
                </form>

            </div>
        </div>

        <!-- FOOTER -->
        <footer>
            <div class="footer-left">
                <span id="clock">00:00:00</span>
                <span>•</span>
                <div class="indicator">Interface de Segurança Carregada</div>
            </div>
            <button class="btn-exit" onclick="sairJogo()">Sair</button>
        </footer>

    </div>

    <!-- PLAYER DE ÁUDIO INVISÍVEL -->
    <audio id="audio-player" loop>
        <!-- Link de música. Substitua pelo link ou arquivo da sua música se quiser -->
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3">
    </audio>

    <!-- SCRIPT DE INTERAÇÃO -->
    <script>
        let currentMode = 'criar'; // Modo padrão (trocado dinamicamente pelo init do servidor)
        let isMuted = false;
        
        const audio = document.getElementById('audio-player');
        const btnAudio = document.getElementById('btn-audio');
        const audioIcon = document.getElementById('audio-icon');
        const eq = document.getElementById('eq');

        // Tentar tocar no primeiro clique de qualquer lugar da tela
        document.body.addEventListener('click', () => {
            if (audio.paused && !isMuted) {
                audio.play().catch(err => console.log("Erro de autoplay ainda travado: ", err));
                eq.classList.add('active');
            }
        }, { once: true });

        // Controle de Mute / Unmute
        btnAudio.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita reativar o evento de body
            isMuted = !isMuted;
            audio.muted = isMuted;
            
            if (isMuted) {
                audioIcon.className = "fa-solid fa-volume-xmark";
                eq.classList.remove('active');
                if (typeof cef !== 'undefined') cef.emit("volts:audio", 0);
            } else {
                audioIcon.className = "fa-solid fa-volume-high";
                eq.classList.add('active');
                audio.play().catch(() => {});
                if (typeof cef !== 'undefined') cef.emit("volts:audio", 1);
            }
        });

        // Alternador de Aba (Ajusta o formulário de Login ou Registro)
        function switchMode(mode) {
            currentMode = mode;
            const tabEntrar = document.getElementById('tab-entrar');
            const tabCriar = document.getElementById('tab-criar');
            const title = document.getElementById('card-title');
            const desc = document.getElementById('card-desc');
            const confirmGroup = document.getElementById('confirm-pass-group');
            const btn = document.getElementById('btn-action');
            const inputSenha = document.getElementById('input-senha');

            if (mode === 'entrar') {
                tabEntrar.classList.add('active');
                tabCriar.classList.remove('active');
                title.innerText = "Acessar Conta";
                desc.innerText = "Insira sua senha segura para entrar no servidor.";
                confirmGroup.style.display = "none";
                document.getElementById('input-confirmar').required = false;
                inputSenha.placeholder = "Digite sua senha";
                btn.innerText = "Entrar no Jogo";
            } else {
                tabCriar.classList.add('active');
                tabEntrar.classList.remove('active');
                title.innerText = "Criar Conta";
                desc.innerText = "Defina uma senha forte para iniciar sua jornada.";
                confirmGroup.style.display = "flex";
                document.getElementById('input-confirmar').required = true;
                inputSenha.placeholder = "Crie uma senha forte (mín. 6 caracteres)";
                btn.innerText = "Criar Conta e Entrar";
            }
        }

        // Mostrar / Ocultar Senha
        function togglePasswordVisibility() {
            const input = document.getElementById('input-senha');
            const eye = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eye.className = 'fa-solid fa-eye-slash toggle-password';
            } else {
                input.type = 'password';
                eye.className = 'fa-solid fa-eye toggle-password';
            }
        }

        // Relógio do Footer
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('clock').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- INTEGRAÇÃO COM SERVER (CEF) ---
        
        window.addEventListener('load', () => {
            // Notifica o Pawn que o CEF está completamente carregado
            if (typeof cef !== 'undefined') {
                cef.emit("volts:ready");
            }
        });

        // Evento volt:init enviado pelo Pawn para configurar o card (Nome e se tem Registro)
        if (typeof cef !== 'undefined') {
            cef.on("volts:init", (nome, registrada) => {
                document.getElementById('player-label').innerText = `${nome} • ${registrada ? 'Registrado' : 'Sem Cadastro'}`;
                
                if (registrada) {
                    switchMode('entrar');
                } else {
                    switchMode('criar');
                }
            });

            // Evento de Feedback de Erros ou Informações
            cef.on("volts:feedback", (tipo, mensagem) => {
                const fb = document.getElementById('feedback');
                const text = document.getElementById('feedback-text');
                
                text.innerText = mensagem;
                fb.style.display = "flex";

                if (tipo === 'erro') {
                    fb.style.background = "rgba(255, 59, 48, 0.1)";
                    fb.style.borderColor = "rgba(255, 59, 48, 0.2)";
                    fb.style.color = "#ff3b30";
                } else {
                    fb.style.background = "rgba(0, 102, 255, 0.1)";
                    fb.style.borderColor = "rgba(0, 102, 255, 0.2)";
                    fb.style.color = "#00d2ff";
                }
            });
        }

        // Disparo ao clicar no botão Enviar (Submit)
        function enviarFormulario(event) {
            event.preventDefault();
            const fb = document.getElementById('feedback');
            fb.style.display = "none";

            const senha = document.getElementById('input-senha').value;
            const confirmar = document.getElementById('input-confirmar').value;

            if (senha.length < 6) {
                fb.style.display = "flex";
                document.getElementById('feedback-text').innerText = "A senha deve ter pelo menos 6 caracteres.";
                return;
            }

            if (currentMode === 'criar') {
                if (senha !== confirmar) {
                    fb.style.display = "flex";
                    document.getElementById('feedback-text').innerText = "As senhas não coincidem.";
                    return;
                }
                
                // Envia para o servidor criar a conta
                if (typeof cef !== 'undefined') {
                    cef.emit("volts:register", senha);
                } else {
                    console.log("Modo criar envia:", senha);
                }
            } else {
                // Envia para o servidor logar
                if (typeof cef !== 'undefined') {
                    cef.emit("volts:login", senha);
                } else {
                    console.log("Modo login envia:", senha);
                }
            }
        }

        // Botão de Fechar / Sair
        function sairJogo() {
            if (typeof cef !== 'undefined') {
                cef.emit("volts:quit");
            } else {
                console.log("Fechando o jogo...");
            }
        }
    </script>
</body>
</html>
