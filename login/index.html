<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOLTS RP — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20">
</head>
<body>
    <!-- FUNDO PANORÂMICO -->
    <div class="bg-layer" aria-hidden="true">
        <div class="bg-photo"></div>
        <div class="bg-vignette"></div>
    </div>

    <!-- TOPO: TEXTO + LINHA BRANCA FINA + MINI PLAYER -->
    <header class="top-bar">
        <div class="top-brand-meta">
            <span class="slashes">///</span>
            <span>VOLTS RP</span>
            <span class="meta-dot">•</span>
            <span>ROLEPLAY REALISTA</span>
            <span class="meta-dot">•</span>
            <span>FAÇÕES</span>
            <span class="meta-dot">•</span>
            <span>ECONOMIA ATIVA</span>
        </div>

        <div class="hud-line-top" aria-hidden="true"></div>

        <!-- MINI PLAYER NO TOPO DIREITO (IGUAL REFERÊNCIA) -->
        <div id="playerBox" class="top-music-player" aria-label="Player de música">
            <div class="top-cover-box">
                <img id="musicCoverImg" src="./capa.png?v=20" alt="Capa" class="top-cover-img">
            </div>

            <div class="top-track-meta">
                <span id="musicTrackTitle" class="track-title">Carregando...</span>
                <span id="musicTrackArtist" class="track-artist">Tocando agora...</span>
            </div>

            <div class="top-music-controls">
                <button id="btnPrevTrack" type="button" class="m-ctrl-btn" title="Anterior" aria-label="Anterior">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/>
                    </svg>
                </button>

                <button id="btnPlayPause" type="button" class="m-ctrl-btn m-play-btn" title="Tocar ou pausar" aria-label="Tocar ou pausar">
                    <svg id="iconPlay" class="hidden" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg id="iconPause" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>

                <button id="btnNextTrack" type="button" class="m-ctrl-btn" title="Próxima" aria-label="Próxima">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <div class="top-volume-badge" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
            </div>
        </div>
    </header>

    <!-- CENTRO: LOGO NA ESQUERDA + PAINEL LOGIN/REGISTRO NA DIREITA -->
    <main class="main-layout">
        <!-- ESQUERDA: LOGO E FRASE (SEM O PAINEL DE BOTÕES) -->
        <section class="hero-left" aria-label="VOLTS RP">
            <img src="./logo.png?v=20" alt="VOLTS RP" class="hero-logo">
            <p class="hero-tagline">
                A CIDADE ESTÁ <span class="amaterasu-text">ESPERANDO...</span>
            </p>
        </section>

        <!-- DIREITA: CARD DE AUTENTICAÇÃO -->
        <section class="auth-card" aria-label="Autenticação VOLTS RP">
            <div class="tabs-bar" role="tablist">
                <button id="tabLogin" type="button" class="tab-btn active" role="tab" aria-selected="true">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/>
                    </svg>
                    <span>LOGIN</span>
                </button>
                <button id="tabRegister" type="button" class="tab-btn" role="tab" aria-selected="false">
                    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                        <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1.003 1.003 0 0 0 0-1.42l-2.34-2.34a1.003 1.003 0 0 0-1.42 0l-1.83 1.83 3.75 3.75 1.84-1.82z"/>
                    </svg>
                    <span>REGISTRO</span>
                </button>
            </div>

            <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="formLogin" class="auth-form" autocomplete="off">
                <div class="input-shell readonly">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input id="loginUsername" type="text" placeholder="Usuário..." readonly>
                </div>

                <div class="input-shell">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input id="loginPassword" type="password" placeholder="Senha..." maxlength="32" required>
                    <button type="button" class="eye-btn" data-target="loginPassword" aria-pressed="false" title="Mostrar ou ocultar senha">
                        <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <div class="form-aux-row">
                    <span id="accountBadge" class="account-status">Verificando conta...</span>
                </div>

                <button id="btnSubmitLogin" type="submit" class="submit-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    <span>ENTRAR</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <!-- FORMULÁRIO DE REGISTRO -->
            <form id="formRegister" class="auth-form hidden" autocomplete="off">
                <div class="input-shell readonly">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </span>
                    <input id="regUsername" type="text" placeholder="Usuário..." readonly>
                </div>

                <div class="input-shell">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input id="regPassword" type="password" placeholder="Crie sua senha (6 a 32)..." maxlength="32" required>
                    <button type="button" class="eye-btn" data-target="regPassword" aria-pressed="false" title="Mostrar ou ocultar senha">
                        <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <div class="input-shell">
                    <span class="input-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </span>
                    <input id="regPasswordConfirm" type="password" placeholder="Confirmar senha..." maxlength="32" required>
                    <button type="button" class="eye-btn" data-target="regPasswordConfirm" aria-pressed="false" title="Mostrar ou ocultar senha">
                        <svg class="icon-eye-open hidden" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <svg class="icon-eye-closed" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                            <line x1="1" y1="1" x2="23" y2="23"/>
                        </svg>
                    </button>
                </div>

                <button id="btnSubmitRegister" type="submit" class="submit-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                        <circle cx="8.5" cy="7" r="4"/>
                        <line x1="20" y1="8" x2="20" y2="14"/>
                        <line x1="23" y1="11" x2="17" y2="11"/>
                    </svg>
                    <span>CRIAR CONTA</span>
                    <span class="spinner hidden"></span>
                </button>
            </form>

            <div class="or-divider"><span>OU</span></div>

            <button id="discordLink" type="button" class="discord-wide-btn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span>Entrar com Discord</span>
            </button>

            <div class="card-security-note">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    <polyline points="9 12 11 14 15 10"/>
                </svg>
                <span>Servidor seguro e livre de cheats.</span>
            </div>
        </section>
    </main>

    <!-- RODAPÉ COM LINHA BRANCA FINA DE PONTA A PONTA -->
    <footer class="bottom-bar">
        <div class="hud-line-bottom" aria-hidden="true"></div>

        <div class="bottom-content">
            <div id="clockPill" class="footer-status is-online">
                <span id="serverStatusDot" class="status-dot"></span>
                <div class="status-texts">
                    <span class="status-label">HORÁRIO DO SERVIDOR</span>
                    <span id="liveClock" class="status-value">--:--:--</span>
                </div>
            </div>

            <div class="footer-slogan">
                ROLEPLAY DE <span class="amaterasu-text">VERDADE</span>, AQUI É <strong>VOLTS RP</strong>.
                <span class="slashes">///</span>
            </div>
        </div>
    </footer>

    <audio id="bgMusic" preload="auto"></audio>
    <script src="app.js?v=20"></script>
</body>
</html>
