<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VOLTS RP — Portal de Acesso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cinematic-frame">
        <header class="top-bar">
            <div class="brand">
                <span class="brand-badge">RP</span>
                <div class="brand-text">
                    <h1>VOLTS <span>ROLEPLAY</span></h1>
                    <p>PORTAL DE AUTENTICAÇÃO • LOS SANTOS</p>
                </div>
            </div>
            <div class="top-actions">
                <button type="button" id="btnFallback" class="btn-ghost">Modo Clássico</button>
                <button type="button" id="btnQuit" class="btn-quit">Sair</button>
            </div>
        </header>

        <main class="portal-container">
            <section class="auth-card" aria-live="polite">
                <div class="card-header">
                    <div class="account-pill" id="accountStatusBadge">
                        <span class="status-dot"></span>
                        <span id="accountStatusText">Verificando registro...</span>
                    </div>
                    <h2 id="cardTitle">Bem-vindo de volta</h2>
                    <p id="cardSubtitle">Confirme sua identidade para entrar na cidade.</p>
                </div>

                <nav class="auth-tabs" role="tablist">
                    <button type="button" class="tab-btn active" id="tabLogin" data-tab="login" role="tab" aria-selected="true">
                        Acessar Conta
                    </button>
                    <button type="button" class="tab-btn" id="tabRegister" data-tab="register" role="tab" aria-selected="false">
                        Criar Conta
                    </button>
                </nav>

                <div id="feedbackBox" class="feedback-box hidden" role="alert"></div>

                <form id="formLogin" class="auth-form" novalidate>
                    <div class="input-group">
                        <label for="loginUsername">Personagem / Usuário</label>
                        <div class="input-wrapper readonly">
                            <input type="text" id="loginUsername" value="Carregando..." readonly tabindex="-1">
                            <span class="input-tag">FIXO</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="loginPassword">Senha de Acesso</label>
                        <div class="input-wrapper">
                            <input type="password" id="loginPassword" placeholder="Digite sua senha" maxlength="63" autocomplete="current-password" required>
                            <button type="button" class="toggle-pass" data-target="loginPassword">Ver</button>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitLogin" class="btn-primary">
                        <span class="btn-label">Entrar na Cidade</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>

                <form id="formRegister" class="auth-form hidden" novalidate>
                    <div class="input-group">
                        <label for="regUsername">Personagem / Usuário</label>
                        <div class="input-wrapper readonly">
                            <input type="text" id="regUsername" value="Carregando..." readonly tabindex="-1">
                            <span class="input-tag">NOVO</span>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPassword">Nova Senha (mín. 6 caracteres)</label>
                        <div class="input-wrapper">
                            <input type="password" id="regPassword" placeholder="Crie uma senha forte" maxlength="63" autocomplete="new-password" required>
                            <button type="button" class="toggle-pass" data-target="regPassword">Ver</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="regPasswordConfirm">Confirmar Senha</label>
                        <div class="input-wrapper">
                            <input type="password" id="regPasswordConfirm" placeholder="Repita a mesma senha" maxlength="63" autocomplete="new-password" required>
                            <button type="button" class="toggle-pass" data-target="regPasswordConfirm">Ver</button>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitRegister" class="btn-primary accent-amber">
                        <span class="btn-label">Criar Conta e Entrar</span>
                        <span class="spinner hidden"></span>
                    </button>
                </form>
            </section>
        </main>

        <footer class="bottom-bar">
            <span>VOLTS RP • Conexão Criptografada SHA-256</span>
            <span class="footer-hint">PC &amp; Mobile Ready</span>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
